name: Stable release
# Pushing a v-prefixed tag that matches package.json builds, signs and
# publishes the release; it can also be started by hand for an existing tag.
# Nothing is published unless the quality gate (the pull-request CI, run on
# the tagged commit) passes and every package builds and passes its checks.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag matching package.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: imago-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  # As in Nodus Research (release-build.yml «quality-gate»): the same CI as
  # pull requests, on the tagged commit. It runs beside the packages, and
  # publication waits for both.
  quality-gate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  packages:
    environment: release-signing
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel is not in this matrix on purpose, as in Nodus Research:
          # release-macos-intel.yml builds it from the same tag and appends it
          # after publication, so the slower Intel runner never holds back
          # Apple silicon, Windows and Linux.
          - { os: macos-latest, target: mac, arch: arm64 }
          - { os: windows-latest, target: win, arch: x64 }
          - { os: ubuntu-22.04, target: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, target: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      IMAGO_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      IMAGO_DISABLE_UPDATES: "1"
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # The application comes from the tag. The stapling retry comes from this
      # workflow's commit and stays out of the bundle, so a tooling fix can
      # also rebuild a tag published before it.
      - name: Checkout this workflow's macOS build tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/macos-stapler-retry.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Apply this workflow's macOS build tooling
        shell: bash
        run: |
          cp .release-tools/scripts/macos-stapler-retry.cjs scripts/
          rm -rf .release-tools
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - name: Validate immutable release tag
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("package.json")).version; if(process.env.IMAGO_RELEASE_TAG!=="v"+v)throw Error("Tag/version mismatch"); fs.appendFileSync(process.env.GITHUB_ENV,"IMAGO_RELEASE_CHANNEL="+(v.includes("-")?"beta":"latest")+"\n");'
          test "$(git describe --tags --exact-match HEAD)" = "$IMAGO_RELEASE_TAG"
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install -y clang-15 rpm cpio xvfb libnspr4 libnss3 libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxtst6 libatspi2.0-0t64 libx11-xcb1 libxdamage1 libxrandr2
          else
            sudo apt-get install -y clang-15 rpm cpio xvfb libnspr4 libnss3 libgtk-3-0 libgbm1 libasound2 libxss1 libxtst6 libatspi2.0-0 libx11-xcb1 libxdamage1 libxrandr2
          fi
          echo "CC=clang-15" >> "$GITHUB_ENV"
          echo "CXX=clang++-15" >> "$GITHUB_ENV"
      - run: npm ci
      # Typecheck, lint, unit and desktop tests run in the quality gate.
      - run: npm run build
      # Same secrets, names and method as Nodus Research (release-build.yml):
      # Developer ID .p12 imported into an isolated keychain, notarization with
      # an App Store Connect API key. Windows builds unsigned unless a
      # certificate is provided, as in Nodus.
      - name: Import macOS signing certificate and notary key
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required macOS release secret is not configured: $name"
              exit 1
            fi
          done
          certificate_path="$RUNNER_TEMP/imago-signing-certificate.p12"
          api_key_path="$RUNNER_TEMP/imago-notary-api-key.p8"
          keychain_path="$RUNNER_TEMP/imago-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          openssl pkey -in "$api_key_path" -noout
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path" >/dev/null
          search_keychains=("$keychain_path")
          while IFS= read -r existing; do
            if [[ -n "$existing" && "$existing" != "$keychain_path" ]]; then search_keychains+=("$existing"); fi
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"([^"]+)".*/\1/')
          security list-keychains -d user -s "${search_keychains[@]}"
          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          if [[ "$identities" != *'"Developer ID Application:'* ]]; then
            echo "::error::The imported .p12 does not contain a valid Developer ID Application identity and private key"
            exit 1
          fi
          # Fail before the long build if codesign cannot use the key here.
          identity_hash="$(awk '/"Developer ID Application:/ { print $2; exit }' <<< "$identities")"
          probe="$RUNNER_TEMP/imago-codesign-probe"
          cp /usr/bin/true "$probe"
          codesign --force --sign "$identity_hash" --keychain "$keychain_path" --timestamp --options runtime "$probe"
          codesign --verify --strict "$probe"
          rm -f "$probe"
          {
            echo "CSC_KEYCHAIN=$keychain_path"
            echo "APPLE_API_KEY=$api_key_path"
          } >> "$GITHUB_ENV"
      - name: Build, sign and notarize (macOS) or build (Windows, Linux)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Optional: with a Windows certificate the installer is signed.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # @electron/notarize 2.5.0 never retries stapling: a lost connection
          # to Apple's ticket service (error 68) would fail a notarized build.
          IMAGO_RETRY_MACOS_STAPLING: "1"
        run: node --require "$GITHUB_WORKSPACE/scripts/macos-stapler-retry.cjs" node_modules/electron-builder/cli.js --${{ matrix.target }} --${{ matrix.arch }} --config build/electron-builder.release.cjs --publish never
      - name: Validate installed packages
        run: node scripts/packaged-e2e.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: signed-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest*.yml
            release/beta*.yml
  publish:
    needs: [quality-gate, packages]
    runs-on: ubuntu-22.04
    environment: release-signing
    permissions:
      contents: write
    env:
      IMAGO_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.tag || github.ref_name }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with: { pattern: "signed-*", path: artifacts }
      - name: Verify all bytes and merge architecture feeds
        run: node scripts/assemble-update-feeds.mjs artifacts feeds "${IMAGO_RELEASE_TAG#v}" --without-mac-intel
      - name: Upload to a draft, then publish
        shell: bash
        run: |
          set -euo pipefail
          # The description is the What's New text in English, in the same order.
          node scripts/generate-release-notes.mjs "$IMAGO_RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
          # Files go to a draft first, so nobody downloads a half-uploaded
          # release; it is published only once every file is in place.
          gh release create "$IMAGO_RELEASE_TAG" --draft --verify-tag --title "Nodus Imago $IMAGO_RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          find artifacts -type f ! -name '*.yml' -print0 | xargs -0 gh release upload "$IMAGO_RELEASE_TAG"
          gh release upload "$IMAGO_RELEASE_TAG" feeds/*.yml
          if [[ "$IMAGO_RELEASE_TAG" == *-* ]]; then
            gh release edit "$IMAGO_RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$IMAGO_RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
  macos-intel:
    # A release published with this workflow's token does not start other
    # workflows, so Intel is started here, after publication, as its own run:
    # it appends its DMG and ZIP to the published release and never holds
    # back or changes the result of this one.
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGO_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      INTEL_WORKFLOW_REF: ${{ github.ref_name }}
    steps:
      - name: Start the macOS Intel release
        run: gh workflow run release-macos-intel.yml --repo "$GITHUB_REPOSITORY" --ref "$INTEL_WORKFLOW_REF" -f tag="$IMAGO_RELEASE_TAG"
