name: Installed Linux regression
on:
  workflow_dispatch:
    inputs:
      artifact-run:
        description: Run containing the current unsigned Linux artifacts
        required: true
        default: "43359643945"
permissions:
  contents: read
  actions: read
jobs:
  places:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libnspr4 libnss3 libgtk-3-0 libgbm1 libasound2 libxss1 libxtst6 libatspi2.0-0 libx11-xcb1 libxdamage1 libxrandr2
      - run: npm ci --ignore-scripts
      - name: Download the existing artifact for a focused regression
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact-run }}
        run: gh run download "$ARTIFACT_RUN" --pattern 'unsigned-test-linux-x64-*' --dir test-results/installed-regression
      - name: Exercise the existing AppImage without rebuilding it
        run: |
          mkdir -p test-results/appimage
          chmod +x test-results/installed-regression/release/*.AppImage
          cd test-results/appimage
          ../../test-results/installed-regression/release/*.AppImage --appimage-extract
          cd ../..
          xvfb-run -a env IMAGO_E2E_NO_SANDBOX=1 IMAGO_E2E_EXECUTABLE="$PWD/test-results/appimage/squashfs-root/AppRun" node scripts/places-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-regression-evidence
          path: |
            test-results/*.json
            test-results/*.png
