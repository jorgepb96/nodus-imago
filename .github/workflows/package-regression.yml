name: Installed Linux regression
on:
  workflow_dispatch:
    inputs:
      artifact-run:
        description: Run containing the current unsigned Linux artifacts
        required: true
        default: "43359643945"
permissions:
  contents: read
  actions: read
jobs:
  places:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y rpm cpio xvfb libnspr4 libnss3 libgtk-3-0 libgbm1 libasound2 libxss1 libxtst6 libatspi2.0-0 libx11-xcb1 libxdamage1 libxrandr2
      - run: npm ci --ignore-scripts
      - name: Download the existing artifact for a focused regression
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact-run }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN/artifacts" --jq '.artifacts[] | select(.name | startswith("unsigned-test-linux-x64-")) | .name')
          gh run download "$ARTIFACT_RUN" --name "$artifact" --dir test-results/installed-regression
      - name: Exercise existing AppImage, DEB and RPM without rebuilding
        run: IMAGO_PACKAGE_DIR="$PWD/test-results/installed-regression/release" node scripts/packaged-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-regression-evidence
          path: |
            test-results/*.json
            test-results/*.png
